name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          install.packages(c(
            "devtools",
            "roxygen2",
            "testthat",
            "covr",
            "ggplot2",
            "dplyr",
            "tidyr"
          ))

      - name: Install package
        run: |
          R CMD build .
          R CMD INSTALL StoatPlot_*.tar.gz

      - name: Run tests
        run: Rscript -e 'library(testthat); test_dir("tests/testthat")'

      - name: Code coverage
        run: Rscript -e 'covr::codecov()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
